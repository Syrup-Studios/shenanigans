#Custom Config Variables that you can use
[custom]
	#Must these variables be parsed along with other variables
	enabled = true

	#Your custom variables to add
	[[custom.variables]]
		name = "downloadbutton"
		value = "Get the Pack!"

	[[custom.variables]]
		name = "modrinthlink"
		value = "https://modrinth.com/modpack/shenanigans"

